<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FERMATools</title>
<meta name="description" content="FERMATools — ferramentas matemáticas e utilitários.">
<style>
  :root { --texto: #1f2a28; --fundo: #ffffff; --destaque: #00695c; --suave: #5b6b68; --cartao: #f2f6f5; }
  @media (prefers-color-scheme: dark) { :root { --texto: #e3ebe9; --fundo: #121816; --destaque: #6fd3c2; --suave: #9fb1ad; --cartao: #1c2422; } }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.6 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 2.2em; margin: 0; letter-spacing: 0.02em; }
  h1 b { color: var(--destaque); }
  .lema { color: var(--suave); margin-top: 0.2em; }
  .app { display: flex; gap: 16px; align-items: center; background: var(--cartao); border-radius: 14px; padding: 16px; margin-top: 28px; }
  .app img { width: 72px; height: 72px; border-radius: 16px; flex: none; }
  .app h2 { margin: 0; font-size: 1.2em; }
  .app p { margin: 0.2em 0; }
  a { color: var(--destaque); }
  footer { margin-top: 48px; color: var(--suave); font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <h1><b>FERMAT</b>ools</h1>
  <p class="lema">FERramentas MATemáticas e utilitários</p>

  <div class="app">
    <img src="readervoice/icone.png" alt="">
    <div>
      <h2>Reader Voice</h2>
      <p>Seus livros EPUB e PDF lidos em voz alta, em português, inglês ou espanhol, com tradução no próprio celular.</p>
      <p><a href="readervoice/privacidade.html" hreflang="pt-BR">Política de privacidade</a> ·
        <a href="readervoice/privacy.html" hreflang="en">Privacy policy</a> ·
        <a href="readervoice/privacidad.html" hreflang="es">Política de privacidad</a></p>
    </div>
  </div>

  <footer>Contato: <a href="mailto:fermatools@gmail.com">fermatools@gmail.com</a></footer>
</main>
</body>
</html>
